name: CI / Automated Testing

on:
  push:
    branches: [ "feat-private-vault-auth", "main", "master" ]
  pull_request:
    branches: [ "feat-private-vault-auth", "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Tests
      env:
        SECRET_KEY: "dummy-secret-key-for-testing"
        ENCRYPTION_KEY: "VotJU4drubJqjpvgDgEEExr6mH5j3SY5clRR9NtYXg0="
        BHV_STREAM_KEY: "b3a464355b990f4813c78572d465e056fa4db810a497ce6f8c3bfeca0957fe31"
        BHV_SECRET_KEY: "G6HZPApKWQwNUVGxALolIJoGWbEJ38j3BjqsnY05C8g="
        GOOGLE_CLIENT_ID: "dummy"
        GOOGLE_CLIENT_SECRET: "dummy"
        MAIL_USERNAME: "dummy"
        MAIL_PASSWORD: "dummy"
        OWNER_EMAIL: "dummy@example.com"
        OWNER_PASSWORD: "dummy"
      run: |
        pytest test_auth.py test_crypto.py -v
